[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemapy"
version = "0.1.4"
description = "A small Python code map generator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codemap contributors" }]
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.8",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
codemapy = "codemapy.cli:main"
codemapy-gui = "codemapy.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
